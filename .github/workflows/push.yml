#
# Push and pull-request validation -- ci.md section 3, tier one.
#
# Hosted runners only, no GPU, target under five minutes. "A job cannot
# retroactively fail a push that has already happened; what it can do is block
# a merge, so these are configured as required checks on the pull request."
#
# The OS matrix is not optional. Slang emitting MSL *text* on Linux and
# Apple's toolchain *accepting* that text are different checks, and only the
# second proves the shader will load on Profile A.
#
# Jobs whose inputs do not exist yet do not silently pass. They print what is
# missing and what will make them real, because "silent skips are how a
# backend quietly stops being tested" (ci.md section 4).

name: push

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A developer who pushes twice should not tie up two runners; the older run is
# redundant the moment the newer one starts.
concurrency:
  group: push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What exists in the tree right now. Later jobs read these outputs so that
  # "nothing to build yet" is reported as a fact rather than inferred from a
  # green tick.
  inventory:
    name: inventory
    runs-on: ubuntu-latest
    outputs:
      has_cpp: ${{ steps.take.outputs.has_cpp }}
      has_headers: ${{ steps.take.outputs.has_headers }}
      has_shaders: ${{ steps.take.outputs.has_shaders }}
      cpp_sources: ${{ steps.take.outputs.cpp_sources }}
      slang_shaders: ${{ steps.take.outputs.slang_shaders }}
      pins_complete: ${{ steps.take.outputs.pins_complete }}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - id: take
        run: xmake ci-inventory --github

      - name: Summarise
        run: |
          {
            echo "### CI inventory"
            echo ""
            echo "| input | count |"
            echo "| --- | --- |"
            echo "| first-party C++ sources | ${{ steps.take.outputs.cpp_sources }} |"
            echo "| Slang shaders | ${{ steps.take.outputs.slang_shaders }} |"
            echo "| pins complete | ${{ steps.take.outputs.pins_complete }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Formatting is the cheapest check there is, so it runs first and alone.
  format:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format
      - name: Check formatting
        run: xmake ci-format

      # The scripting side of the warning policy. C++ builds with
      # -Wunused -Werror; the Lua that drives CI gets the same treatment.
      - name: Check the CI Lua for dead code
        run: xmake ci-lua

  # CPU fixtures. At R0 these are the CI tooling's own tests -- parsers and
  # validators that run on machines nobody is watching. The math test vectors,
  # quantization round-trips and cut-validity tests join them as they land.
  # No GPU, no engine, so they run on every push.
  tests:
    name: CPU fixtures (CI tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - name: Run the CI tooling tests
        run: xmake ci-test

  # The harness, end to end, on every push: capture the machine manifest,
  # emit a T1 bundle, and validate its layout. No GPU and no engine needed --
  # at R0 every fixture reports NOT_RUN with its reason, which is exactly what
  # should be asserted. A harness that stops producing valid bundles is found
  # here, not at a release boundary when the bundle is the evidence.
  #
  # This is also the only place ci-machine and ci-bundle run in CI.
  harness:
    name: benchmark harness (T1)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - name: Capture the machine manifest
        run: xmake ci-machine -o "machine-${{ matrix.os }}.json"

      - name: Emit a T1 bundle
        run: xmake bench --tier=T1 --out="results/ci/${{ github.sha }}" --no-power

      - name: Validate the bundle layout
        run: xmake ci-bundle "results/ci/${{ github.sha }}"

      # A hosted runner is not in ci/machines.json, so it must resolve to
      # 'development' and its bundle must not claim to be evidence. If that
      # ever inverts, a cloud run could be archived behind a published claim.
      - name: Assert a cloud runner produces no evidence
        shell: bash
        run: |
          manifest="results/ci/${{ github.sha }}/manifest.json"
          role=$(grep -o '"machine_role":"[^"]*"' "$manifest" | cut -d'"' -f4)
          eligible=$(grep -o '"evidence_eligible":[a-z]*' "$manifest" | cut -d: -f2)
          echo "machine_role=$role evidence_eligible=$eligible"
          if [ "$role" != "development" ] || [ "$eligible" != "false" ]; then
            echo "::error title=Cloud runner claimed evidence eligibility::A hosted runner is not qualification hardware. It must resolve to 'development' with evidence_eligible=false, or mock runs can be archived as evidence."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-${{ matrix.os }}
          path: |
            results/ci/${{ github.sha }}
            machine-${{ matrix.os }}.json
          retention-days: 14

  # Every benchmark and cooker manifest validates against the schema.
  # The committed examples are validated too: they are the tripwire for an
  # incompatible edit to a contract frozen at R0.
  schema:
    name: manifest schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - name: Validate the committed schema examples
        run: |
          xmake ci-schema \
            --schema=ci/schema/run-manifest.schema.json \
            ci/schema/examples/run-manifest.documented.json \
            ci/schema/examples/run-manifest.unavailable.json

      - name: Validate every result bundle in the tree
        run: |
          shopt -s nullglob globstar
          bundles=(results/**/manifest.json)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::notice title=No result bundles::No results/**/manifest.json in the tree. This job validates the committed schema examples only until vg_bench emits its first bundle (R0, bench/ deliverable)."
            exit 0
          fi
          xmake ci-schema --schema=ci/schema/run-manifest.schema.json "${bundles[@]}"

  # Gate B0.4.
  #
  # --tools-optional, because a hosted runner has no Slang install and failing
  # there would report "the pin is wrong" when the truth is "this machine
  # cannot check it". The file-based pins -- clusterlod.h's vendored sha256
  # and meshoptimizer's commit in the package definition -- need no tool and
  # are checked strictly here. The GPU runners and the gate run without the
  # flag, where the toolchain genuinely must be present.
  pins:
    name: pinned inputs (B0.4)
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - name: Verify pins
        run: xmake ci-pins --tools-optional
      - name: Flag unfilled pins
        if: ${{ needs.inventory.outputs.pins_complete != 'true' }}
        run: echo "::warning title=B0.4 not satisfied::ci/pins.json has unfilled entries. B0.4 is a required gate condition and blocks the end of R0. Fill in the exact tag or commit you vendored."


  # Debug and release, both platforms' host code, warnings as errors.
  build:
    name: host build (${{ matrix.os }}, ${{ matrix.mode }})
    needs: inventory
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Report that there is nothing to build yet
        if: ${{ needs.inventory.outputs.has_cpp != 'true' && needs.inventory.outputs.has_headers != 'true' }}
        run: |
          echo "::notice title=Host build not yet active::gamegine/ contains no source at all, so there is nothing to compile. This job becomes a real check with the first file from the R0 core/, platform/, rhi/ and backends/vulkan/ deliverables (r0-architecture.md section 4). It is reported, not skipped silently."

      - uses: xmake-io/github-action-setup-xmake@v1
        if: ${{ needs.inventory.outputs.has_headers == 'true' }}
        with:
          xmake-version: '3.1.1'

      # xmake's 'vulkansdk' package is system-only: its definition has an
      # on_fetch and no on_install, so it can never be downloaded. It resolves
      # in this order -- $VULKAN_SDK, then pkg-config, then /usr on Linux only
      # -- and a hosted runner satisfies none of them out of the box. Headers
      # and the loader are enough to compile and link host code, which is all
      # this tier does; the runners have no GPU to run against anyway.
      - name: Install Linux build dependencies
        if: ${{ needs.inventory.outputs.has_headers == 'true' && matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libvulkan-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev ninja-build

      - name: Install macOS build dependencies
        if: ${{ needs.inventory.outputs.has_headers == 'true' && matrix.os == 'macos-latest' }}
        run: |
          brew install vulkan-headers vulkan-loader
          # macOS has no /usr fallback in find_vulkansdk, so point VULKAN_SDK
          # at the Homebrew prefix: it wants <prefix>/lib/libvulkan.dylib and
          # <prefix>/include/vulkan/vulkan.h, which is exactly how brew links.
          echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"

      # Prove the SDK is actually resolvable before configuring. Without this
      # a resolution failure surfaces as a confusing xmake error attributed to
      # whatever source file happened to be compiling.
      - name: Verify Vulkan is resolvable
        if: ${{ needs.inventory.outputs.has_headers == 'true' }}
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            pkg-config --modversion vulkan \
              || { echo "::error title=Vulkan not resolvable::libvulkan-dev did not provide a pkg-config vulkan module. xmake's vulkansdk package cannot be downloaded, so the host build cannot proceed."; exit 1; }
          else
            test -f "$VULKAN_SDK/include/vulkan/vulkan.h" \
              || { echo "::error title=Vulkan headers missing::No vulkan/vulkan.h under VULKAN_SDK=$VULKAN_SDK"; exit 1; }
            ls "$VULKAN_SDK/lib/"libvulkan*.dylib \
              || { echo "::error title=Vulkan loader missing::No libvulkan dylib under VULKAN_SDK=$VULKAN_SDK"; exit 1; }
          fi

      - name: Configure
        if: ${{ needs.inventory.outputs.has_headers == 'true' }}
        run: xmake config --mode=${{ matrix.mode }} --yes

      - name: Build
        if: ${{ needs.inventory.outputs.has_headers == 'true' }}
        run: xmake build --yes

      # Unit tests run here rather than in their own job because they need the
      # same Vulkan resolution and the same built tree; a separate job would
      # pay for both twice.
      - name: Unit tests
        if: ${{ needs.inventory.outputs.has_headers == 'true' }}
        run: xmake test

      # Static analysis completes the "Format and lint" row of ci.md section
      # 3. It runs here because clang-tidy needs compile_commands.json, which
      # only exists after a build. Linux only: the findings are the same on
      # both platforms and there is no reason to pay for them twice.
      - name: Static analysis
        if: ${{ needs.inventory.outputs.has_headers == 'true' && matrix.os == 'ubuntu-latest' && matrix.mode == 'release' }}
        run: |
          sudo apt-get install --no-install-recommends -y clang-tidy
          xmake ci-tidy

  # Slang emits SPIR-V on Linux; Apple's toolchain accepts the MSL on macOS.
  # A kernel that builds for one target and not the other fails here, not at a
  # gate eighty weeks later.
  shaders:
    name: shader compile (${{ matrix.target }})
    needs: inventory
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: spirv
          - os: macos-latest
            target: msl
    steps:
      - uses: actions/checkout@v4

      - name: Report that there are no kernels yet
        if: ${{ needs.inventory.outputs.has_shaders != 'true' }}
        run: |
          echo "::notice title=Shader compile not yet active::No shaders/**.slang in the tree. This job becomes a real check with the first kernel from the R0 shaders/ deliverable -- one non-trivial kernel compiled and running on both SPIR-V and MSL from a single Slang source (gate B0.1, required). It is reported, not skipped silently."

      - name: Confirm the Metal toolchain is present
        if: ${{ needs.inventory.outputs.has_shaders == 'true' && matrix.target == 'msl' }}
        run: |
          # B0.1 is only proven where 'metal' and 'metallib' actually accept
          # the MSL. If the component is missing, say so loudly: a green tick
          # from a machine that cannot compile Metal proves nothing.
          if ! xcrun -sdk macosx metal --version; then
            echo "::error title=Metal toolchain missing::'metal' is not installed on this runner. Install it with 'xcodebuild -downloadComponent MetalToolchain'. B0.1 cannot be evaluated without it, and an absent toolchain is UNAVAILABLE, never a pass."
            exit 1
          fi
